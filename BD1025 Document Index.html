const NM={DIR:'Directory',FIL:'File',TAB:'Tab',TEC:'Document'};
let total=0,pdfs=0,sel=null;
function idx(n){total++;pdfs+=(n.p||[]).length;n.s=(n.d+' '+n.n+' '+Object.values(n.m).join(' ')+' '+(n.p||[]).join(' ')).toLowerCase();(n.c||[]).forEach(idx)}
DATA.forEach(idx);
document.getElementById('stat').textContent=total+' entries · '+pdfs+' PDF files';
function hit(n,q){n.h=!q||n.s.includes(q);let any=n.h;(n.c||[]).forEach(c=>{if(hit(c,q))any=true});n.any=any;return any}
function row(n){return '<span class="tag">'+(NM[n.t]||n.t)+'</span>'+esc(n.d||n.n)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function build(n,q,open){
  if(!n.any)return null;
  const kids=(n.c||[]).map(c=>build(c,q,open)).filter(Boolean);
  let el;
  if(kids.length){el=document.createElement('details');if(open||n.t==='DIR')el.open=true;
    const s=document.createElement('summary');s.innerHTML=row(n);s.onclick=()=>show(n,s);el.append(s,...kids)}
  else{el=document.createElement('div');el.className='leaf';el.innerHTML=row(n);el.onclick=()=>show(n,el)}
  return el}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();
  DATA.forEach(n=>hit(n,q));const t=document.getElementById('tree');t.innerHTML='';
  DATA.forEach(n=>{const e=build(n,q,!!q);if(e)t.append(e)});
  if(!t.children.length)t.innerHTML='<p class="mu">No matches.</p>'}
function show(n,el){if(sel)sel.classList.remove('sel');sel=el;el.classList.add('sel');
  const base=document.getElementById('base').value.trim().replace(/\/?$/,'/');const hasB=document.getElementById('base').value.trim();
  const L={KfpDrawingCatalogueNo:'Drawing no.',KfpKks:'KKS',KfpDate:'Date',KfpDiscipline:'Discipline',KfpOriginatorCompany:'Originator',KfpLanguage:'Language',KfpVolumeIdent:'Volume',KfpManufacturer:'Manufacturer'};
  let h='<h2>'+esc(n.d||n.n)+'</h2><dl><dt>Type</dt><dd>'+(NM[n.t]||n.t)+'</dd><dt>Number</dt><dd>'+esc(n.n)+'</dd>'+
   Object.entries(n.m).map(([k,v])=>'<dt>'+L[k]+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl>';
  if(n.p){h+='<b>PDF files ('+n.p.length+')</b><div class="files">'+n.p.map(p=>'<a target="_blank" rel="noopener" href="'+esc(hasB?base+p:p)+'">'+esc(p.split('/').pop())+'<br><span class="mu">'+esc(p)+'</span></a>').join('')+'</div>';
    if(!hasB)h+='<p class="mu">Links are relative: they work when this page sits next to the PDF folders, or enter a base URL above.</p>'}
  else h+='<p class="mu">Contains '+(n.c||[]).length+' item(s).</p>';
  document.getElementById('det').innerHTML=h}
document.getElementById('q').oninput=render;render();
